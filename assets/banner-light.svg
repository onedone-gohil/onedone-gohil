<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Vandan Gohil, Design Engineer">
  <defs>
    <linearGradient id="accentL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16A34A"/>
      <stop offset="1" stop-color="#16A34A" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="glowL" cx="86%" cy="16%" r="62%">
      <stop offset="0" stop-color="#16A34A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#16A34A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotsL" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#000000" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="dotfadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.35" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="dotmaskL"><rect width="1000" height="250" fill="url(#dotfadeL)"/></mask>
  </defs>

  <rect x="1" y="1" width="998" height="248" rx="22" fill="#FBFBF9" stroke="#E7E7E2" stroke-width="1.5"/>
  <rect x="1" y="1" width="998" height="248" rx="22" fill="url(#dotsL)" mask="url(#dotmaskL)"/>
  <rect x="1" y="1" width="998" height="248" rx="22" fill="url(#glowL)"/>

  <!-- eyebrow: pulsing online dot + role -->
  <circle cx="64" cy="55" r="5" fill="#16A34A">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="64" cy="55" r="5" fill="none" stroke="#16A34A" stroke-width="1.5">
    <animate attributeName="r" values="5;12" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="82" y="60" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="4" fill="#6B6C70">DESIGN ENGINEER</text>

  <!-- name -->
  <text x="56" y="143" font-size="66" font-weight="600" letter-spacing="-2.5" fill="#17181A">Vandan Gohil</text>

  <!-- draw-in accent underline -->
  <line x1="59" y1="163" x2="372" y2="163" stroke="url(#accentL)" stroke-width="3" stroke-linecap="round" stroke-dasharray="320" stroke-dashoffset="320">
    <animate attributeName="stroke-dashoffset" values="320;0" keyTimes="0;1" dur="1s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/>
  </line>

  <!-- tagline -->
  <text x="59" y="201" font-size="20" fill="#55565A">I design AI-native products and ship them as production React.</text>

  <!-- meta -->
  <text x="59" y="230" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="0.5" fill="#8A8B8E">one-done  ·  tempe, arizona  ·  figma &#8594; production react</text>
</svg>
